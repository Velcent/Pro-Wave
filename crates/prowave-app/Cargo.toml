[package]
name = "prowave-app"
version = "0.1.2"
edition = "2021"
description = "Pro Wave desktop app (egui) - clean-room DAW UI inspired by Logic Pro"
license = "GPL-3.0-or-later"

[[bin]]
name = "prowave"
path = "src/main.rs"

[dependencies]
assert_no_alloc = "1.1.2"
eframe = "0.37.0"
egui = "0.37"
human-panic = "2.0.8"
prowave-engine = { version = "0.1.0", path = "../prowave-engine" }
prowave-project = { version = "0.1.0", path = "../prowave-project" }
rfd = "0.17.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

# The menus in the macOS system menu bar (see src/native_menu.rs).
[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "=0.21.0", default-features = false }

[build-dependencies]
winresource = "0.1.34"

[dev-dependencies]
tempfile = "3.27.0"
