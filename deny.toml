# cargo-deny policy (run via `cargo xtask check`). ProWave is GPL-3.0-or-later; dependencies
# must use GPL-compatible permissive licences.

[advisories]
ignore = [
    # ttf-parser is unmaintained (not a vulnerability). It is pulled in by winit's Linux
    # window decorations (winit -> sctk-adwaita -> ab_glyph); no upgrade exists yet.
    # Revisit when winit moves to skrifa.
    { id = "RUSTSEC-2026-0192", reason = "transitive via winit/sctk-adwaita, no fix available" },
    # zbus_names / zvariant / zvariant_derive: "no longer maintained as a standalone crate" (not a
    # vulnerability). Linux-only: eframe -> egui-winit -> accesskit_winit -> accesskit_unix -> atspi.
    # Revisit when accesskit moves to the successor crates.
    { id = "RUSTSEC-2026-0370", reason = "zvariant: Linux accessibility dependency via egui, no fix available" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names: Linux accessibility dependency via egui, no fix available" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: Linux accessibility dependency via egui, no fix available" },
    # smartstring is unmaintained (not a vulnerability); it is used by rhai (the Scripter MIDI FX).
    { id = "RUSTSEC-2026-0249", reason = "unmaintained, transitive via rhai, no fix available" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "Unicode-3.0",
    "MPL-2.0",
    # A public-domain dedication (tiny-keccak, via rhai's const-random).
    "CC0-1.0",
    "OFL-1.1",
    # The list of trusted certificate authorities (webpki-roots / webpki-root-certs, pulled in
    # by the update check's HTTPS client). A permissive licence for data.
    "CDLA-Permissive-2.0",
    "Ubuntu-font-1.0",
    "GPL-3.0-or-later",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
